        function runSeoDiagnostic() {
            const container = document.getElementById('seo-results');
            let html = '';

            const title = document.title;
            const hasGoodTitle = title && title.length >= 10 && title.length <= 70;
            html += diagnosticItem("Thẻ Tiêu đề (Title)", hasGoodTitle, title || "Không tìm thấy", "Nên từ 10-70 ký tự.");

            const descMeta = document.querySelector('meta[name="description"]');
            const desc = descMeta ? descMeta.getAttribute('content') : "";
            const hasGoodDesc = desc && desc.length >= 50 && desc.length <= 160;
            html += diagnosticItem("Thẻ Mô tả (Description)", hasGoodDesc, desc ? `${desc.length} ký tự` : "Không có", "Nên từ 50-160 ký tự.");

            const canonical = document.querySelector('link[rel="canonical"]');
            const hasCanonical = canonical && canonical.href;
            html += diagnosticItem("Đường dẫn chuẩn (Canonical)", hasCanonical, hasCanonical ? canonical.href : "Chưa cấu hình", "Giúp Google nhận diện URL chính.");

            const schema = document.querySelector('script[type="application/ld+json"]');
            const hasSchema = schema !== null;
            html += diagnosticItem("Dữ liệu cấu trúc (Schema)", hasSchema, hasSchema ? "Đã cài đặt CafeOrCoffeeShop" : "Chưa có", "Giúp Google hiển thị bản đồ và giờ mở cửa.");

            container.innerHTML = html;
        }

            const icon = status ? '<i class="fa-solid fa-circle-check text-emerald-500"></i>' : '<i class="fa-solid fa-triangle-exclamation text-amber-500"></i>';
            const bgClass = status ? 'bg-emerald-50/50 border-emerald-100' : 'bg-amber-50/50 border-amber-100';
            return `
                <div class="p-2.5 rounded-xl border ${bgClass} flex flex-col gap-0.5">

                        <span>${icon} ${title}</span>

                    </div>
                    <p class="text-[10px] text-slate-500 italic">${advice}</p>
                </div>
            `;
        }
